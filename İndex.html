<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türk Daması</title>

<style>
body{
    font-family:Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:#f0f0f0;
}

h1{
    margin-top:20px;
}

#board{
    display:grid;
    grid-template-columns:repeat(8,70px);
    grid-template-rows:repeat(8,70px);
    border:4px solid #333;
}

.cell{
    width:70px;
    height:70px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:36px;
    cursor:pointer;
}

.light{
    background:#f5deb3;
}

.dark{
    background:#c19a6b;
}

.selected{
    outline:4px solid yellow;
}

#status{
    margin:15px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>Türk Daması</h1>

<div id="status">Sıra: Beyaz</div>
<div id="board"></div>

<script>
const boardElement = document.getElementById("board");
const statusText = document.getElementById("status");

let currentPlayer = "white";
let selected = null;

let board = [
["","","","","","","",""],
["b","b","b","b","b","b","b","b"],
["b","b","b","b","b","b","b","b"],
["","","","","","","",""],
["","","","","","","",""],
["w","w","w","w","w","w","w","w"],
["w","w","w","w","w","w","w","w"],
["","","","","","","",""]
];

function drawBoard(){
    boardElement.innerHTML = "";

    for(let row=0; row<8; row++){
        for(let col=0; col<8; col++){

            const cell = document.createElement("div");

            cell.className =
                "cell " +
                ((row+col)%2===0 ? "light" : "dark");

            if(selected &&
               selected.row===row &&
               selected.col===col){
                cell.classList.add("selected");
            }

            if(board[row][col]==="w"){
                cell.textContent="⚪";
            }else if(board[row][col]==="b"){
                cell.textContent="⚫";
            }

            cell.addEventListener("click",
                ()=>cellClick(row,col));

            boardElement.appendChild(cell);
        }
    }

    statusText.textContent =
        "Sıra: " +
        (currentPlayer==="white" ? "Beyaz" : "Siyah");
}

function cellClick(row,col){

    const piece = board[row][col];

    if(piece){
        if(
            (currentPlayer==="white" && piece==="w") ||
            (currentPlayer==="black" && piece==="b")
        ){
            selected = {row,col};
            drawBoard();
        }
        return;
    }

    if(!selected) return;

    movePiece(row,col);
}

function movePiece(newRow,newCol){

    const {row,col} = selected;

    const piece = board[row][col];

    let valid = false;

    if(piece==="w"){
        if(
            newRow===row-1 &&
            (
                newCol===col ||
                newCol===col-1 ||
                newCol===col+1
            )
        ){
            valid = true;
        }
    }

    if(piece==="b"){
        if(
            newRow===row+1 &&
            (
                newCol===col ||
                newCol===col-1 ||
                newCol===col+1
            )
        ){
            valid = true;
        }
    }

    if(valid){
        board[newRow][newCol]=piece;
        board[row][col]="";

        currentPlayer =
            currentPlayer==="white"
            ? "black"
            : "white";
    }

    selected = null;
    drawBoard();
}

drawBoard();
</script>

</body>
</html>
